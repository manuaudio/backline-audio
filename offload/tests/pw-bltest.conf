# A private, throwaway PipeWire daemon for the capacity tests: its own socket
# (pipewire-bltest), its own dummy driver at quantum 64 / 48 kHz, no devices,
# no session manager, no D-Bus, and deliberately NO module-rt (no realtime
# priority: this box has no rtkit and RLIMIT_RTPRIO 0). Manu's PipeWire, its
# defaults and any running Backline demo are never touched.
# Run: pipewire -c $PWD/pw-bltest.conf ; clients: PIPEWIRE_REMOTE=pipewire-bltest
context.properties = {
    core.daemon             = true
    core.name               = pipewire-bltest
    support.dbus            = false
    default.clock.rate      = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum   = 64
    default.clock.min-quantum = 64
    default.clock.max-quantum = 64
    default.clock.quantum-limit = 8192
    mem.allow-mlock         = true
    log.level               = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access
        args = { access.socket = { pipewire-bltest = "unrestricted" pipewire-bltest-manager = "unrestricted" } } }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = BLTest-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
            clock.quantum   = 64
        }
    }
]
