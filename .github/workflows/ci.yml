name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # PipeWire >= 1.4 is required; Ubuntu 24.04 ships 1.0, so build in containers.
          - distro: archlinux
            image: archlinux:latest
          - distro: debian-trixie
            image: debian:trixie
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies (Arch)
        if: matrix.distro == 'archlinux'
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja pkgconf \
            pipewire libpipewire systemd-libs libsndfile alsa-lib json-c lilv openssl vst3sdk \
            pipewire-jack libltc asio \
            wireplumber jq python dbus avahi
      # Arch builds the worker with VST3 (extra/vst3sdk 3.8, found through
      # pkg-config) and clockd with Ableton Link (fetched, pinned by hash);
      # Debian builds both without, so every path stays green.
      - name: Install build dependencies (Debian)
        if: matrix.distro == 'debian-trixie'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build pkg-config ca-certificates \
            libpipewire-0.3-dev libsystemd-dev libsndfile1-dev libasound2-dev \
            libjson-c-dev liblilv-dev libssl-dev \
            libjack-jackd2-dev libltc-dev libasio-dev libavahi-client-dev dbus-daemon
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.distro == 'archlinux' && '-DBACKLINE_LINK=ON' || '' }}
      - name: Build
        run: cmake --build build
      # Under a session bus of its own, so tests/autolink-proof can run a
      # private PipeWire and WirePlumber (it is skipped where they're missing).
      - name: Unit tests
        run: |
          if command -v dbus-run-session >/dev/null; then
            dbus-run-session -- ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
